
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --paper: #f5f3ee;
  --ink: #262b2b;
  --water: #dce5e5;
  --muted: #8a9290;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "DM Sans", "Noto Serif SC", sans-serif;
  overflow-x: hidden;
}

/* Navigation */

nav {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 28px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.logo {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 400;
}

.language {
  display: flex;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 1px;
}

.language button {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
}

.language button.active {
  color: var(--ink);
}

/* Hero */

.hero {
  min-height: 100vh;
  height: 900px;
  max-height: 1100px;
  position: relative;
  overflow: hidden;
}

/* Sky */

.sky {
  position: absolute;
  inset: 0;
  background: var(--paper);
}

/* Water */

.water {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 36%;
  background: var(--water);
  overflow: hidden;
}

.water::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: rgba(70, 90, 90, 0.12);
}

/* Water texture */

.water-texture {
  position: absolute;
  inset: 0;
  opacity: 0.25;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 18px,
      rgba(70, 90, 90, 0.12) 19px,
      transparent 20px
    );
}

/* Bird */

.bird {
  position: absolute;
  width: 110px;
  left: -150px;
  top: 40%;
  z-index: 5;
  animation: fly 6s cubic-bezier(.25,.45,.35,1) forwards;
}

.bird svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

@keyframes fly {
  0% {
    left: -150px;
    top: 42%;
    transform: rotate(-5deg) scale(.75);
  }

  25% {
    top: 30%;
    transform: rotate(3deg) scale(.9);
  }

  55% {
    top: 24%;
    transform: rotate(-2deg) scale(1);
  }

  80% {
    top: 33%;
    transform: rotate(3deg) scale(.95);
  }

  100% {
    left: 110%;
    top: 38%;
    transform: rotate(0deg) scale(.85);
  }
}

/* Ripples */

.ripple {
  position: absolute;
  width: 80px;
  height: 30px;
  border: 1px solid rgba(70, 90, 90, 0.2);
  border-radius: 50%;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%) scale(0);
  opacity: 0;
}

.ripple:nth-child(2) {
  animation: ripple 3s 2s ease-out infinite;
}

.ripple:nth-child(3) {
  animation: ripple 3s 2.6s ease-out infinite;
}

.ripple:nth-child(4) {
  animation: ripple 3s 3.2s ease-out infinite;
}

@keyframes ripple {
  0% {
    transform: translateX(-50%) scale(.2);
    opacity: .5;
  }

  100% {
    transform: translateX(-50%) scale(3);
    opacity: 0;
  }
}

/* Categories */

.choices {
  position: absolute;
  bottom: 12%;
  left: 0;
  width: 100%;
  padding: 0 9%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
  opacity: 0;
  transform: translateY(25px);
  animation: reveal 1.5s 6s forwards;
  z-index: 6;
}

@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.choice {
  border-top: 1px solid rgba(40, 50, 50, 0.35);
  padding-top: 18px;
  text-decoration: none;
  color: var(--ink);
  transition: opacity .3s;
}

.choice:hover {
  opacity: .55;
}

.number {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 24px;
}

.choice h2 {
  font-weight: 300;
  font-size: 25px;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.choice p {
  font-family: "Noto Serif SC", serif;
  font-weight: 300;
  font-size: 13px;
  color: #737d7b;
  letter-spacing: 1px;
}

/* Footer */

.footer {
  position: absolute;
  bottom: 28px;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  z-index: 8;
}

/* Replay */

.replay {
  position: absolute;
  right: 5%;
  top: 100px;
  border: none;
  background: none;
  font-family: inherit;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 1px;
  z-index: 10;
}

/* Responsive */

@media (max-width: 700px) {
  .hero {
    height: 100svh;
    min-height: 700px;
  }

  .water {
    height: 40%;
  }

  .choices {
    grid-template-columns: 1fr;
    gap: 24px;
    bottom: 12%;
    padding: 0 8%;
  }

  .choice {
    padding-top: 10px;
  }

  .number {
    margin-bottom: 8px;
  }

  .choice h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }

  .choice p {
    font-size: 12px;
  }

  .footer {
    bottom: 18px;
  }

  .bird {
    width: 85px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">PORTFOLIO / 2026</div>

  <div class="language">
    <button id="zhBtn" class="active" onclick="changeLanguage('zh')">中文</button>
    <span>/</span>
    <button id="enBtn" onclick="changeLanguage('en')">EN</button>
  </div>
</nav>

<main class="hero">

  <div class="sky"></div>

  <div class="bird" id="bird">
    <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">

      <path
        d="M20 62
           C45 40, 65 38, 90 48
           C108 34, 130 12, 160 8
           C142 35, 125 52, 115 63
           C145 58, 170 55, 190 65
           C160 70, 135 76, 115 77
           C100 90, 80 100, 58 103
           C75 85, 85 77, 90 68
           C65 78, 45 80, 20 62 Z"
        fill="#262b2b"/>

    </svg>
  </div>

  <div class="water">
    <div class="water-texture"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
  </div>

  <button class="replay" onclick="startAnimation()" id="replayBtn">
    ↻
  </button>

  <section class="choices">

    <a href="#" class="choice">
      <div class="number">01 /</div>
      <h2 id="title1">社交媒体</h2>
      <p id="desc1">账号运营与内容策划</p>
    </a>

    <a href="#" class="choice">
      <div class="number">02 /</div>
      <h2 id="title2">视觉设计</h2>
      <p id="desc2">视觉表达与设计实践</p>
    </a>

    <a href="#" class="choice">
      <div class="number">03 /</div>
      <h2 id="title3">影像</h2>
      <p id="desc3">视频与影像创作</p>
    </a>

  </section>

  <footer class="footer">
    <span id="footerLeft">个人作品集</span>
    <span>2026</span>
  </footer>

</main>

<script>

const translations = {
  zh: {
    title1: "社交媒体",
    desc1: "账号运营与内容策划",
    title2: "视觉设计",
    desc2: "视觉表达与设计实践",
    title3: "影像",
    desc3: "视频与影像创作",
    footer: "个人作品集",
    replay: "重新播放"
  },

  en: {
    title1: "Social Media",
    desc1: "Content & Account Management",
    title2: "Visual Design",
    desc2: "Visual Communication & Design",
    title3: "Video",
    desc3: "Moving Image & Video",
    footer: "Selected Works",
    replay: "Replay"
  }
};

function changeLanguage(lang) {

  const t = translations[lang];

  document.getElementById("title1").textContent = t.title1;
  document.getElementById("desc1").textContent = t.desc1;

  document.getElementById("title2").textContent = t.title2;
  document.getElementById("desc2").textContent = t.desc2;

  document.getElementById("title3").textContent = t.title3;
  document.getElementById("desc3").textContent = t.desc3;

  document.getElementById("footerLeft").textContent = t.footer;

  document.getElementById("replayBtn").textContent = "↻ " + t.replay;

  document.getElementById("zhBtn").classList.toggle("active", lang === "zh");
  document.getElementById("enBtn").classList.toggle("active", lang === "en");
}

/* Replay animation */

function startAnimation() {

  const bird = document.getElementById("bird");
  const choices = document.querySelector(".choices");

  bird.style.animation = "none";
  choices.style.animation = "none";

  bird.offsetHeight;

  bird.style.animation = "fly 6s cubic-bezier(.25,.45,.35,1) forwards";

  choices.style.opacity = "0";
  choices.style.transform = "translateY(25px)";

  choices.offsetHeight;

  choices.style.animation = "reveal 1.5s 6s forwards";
}

</script>

</body>
</html>
