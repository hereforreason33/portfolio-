
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio / 2026</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: "Times New Roman", "Songti SC", serif;
  color: #183c49;
  background: #c8dce5;
}

.page {
  width: 100vw;
  height: 100vh;
  min-height: 600px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.42), transparent 50%),
    linear-gradient(180deg, #e2edf1 0%, #c5dce5 55%, #b4d0dc 100%);
}

/* 水面 */

.water {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.light {
  position: absolute;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.85),
    transparent
  );
  filter: blur(1px);
  animation: lightMove 7s ease-in-out infinite alternate;
}

.light:nth-child(1) {
  width: 50%;
  top: 34%;
  left: -10%;
}

.light:nth-child(2) {
  width: 60%;
  top: 47%;
  left: 25%;
  animation-delay: 2s;
}

.light:nth-child(3) {
  width: 45%;
  top: 60%;
  left: 10%;
  animation-delay: 1s;
}

.light:nth-child(4) {
  width: 70%;
  top: 73%;
  left: 30%;
  animation-delay: 3s;
}

.light:nth-child(5) {
  width: 40%;
  top: 85%;
  left: 0;
  animation-delay: 2.5s;
}

@keyframes lightMove {
  from {
    opacity: .2;
    transform: translateX(-2%);
  }
  to {
    opacity: .8;
    transform: translateX(3%);
  }
}

/* 涟漪 */

.ripple {
  position: absolute;
  width: 260px;
  height: 100px;
  transform: translate(-50%, -50%);
}

.ripple span {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 50%;
  box-shadow: 0 0 5px rgba(255,255,255,.2);
  animation: ripplePulse 4s ease-in-out infinite;
}

.ripple span:nth-child(2) {
  inset: 15px 25px;
  animation-delay: .7s;
}

.ripple span:nth-child(3) {
  inset: 30px 50px;
  animation-delay: 1.4s;
}

.ripple span:nth-child(4) {
  inset: 40px 75px;
  animation-delay: 2s;
}

@keyframes ripplePulse {
  0%, 100% {
    opacity: .35;
    transform: scale(.94);
  }
  50% {
    opacity: .9;
    transform: scale(1.04);
  }
}

.r1 {
  top: 29%;
  left: 23%;
}

.r2 {
  top: 44%;
  left: 72%;
}

.r3 {
  top: 54%;
  left: 43%;
}

.r4 {
  top: 60%;
  left: 88%;
}

.r5 {
  top: 74%;
  left: 15%;
}

/* 顶部 */

.top {
  position: absolute;
  top: 4%;
  left: 4%;
  right: 4%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.logo {
  letter-spacing: 5px;
  font-size: clamp(12px, 1.4vw, 18px);
}

.language {
  font-size: 15px;
  letter-spacing: 3px;
}

.language button {
  background: none;
  border: none;
  color: inherit;
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  letter-spacing: inherit;
  padding: 5px;
}

.language button.active {
  border-bottom: 1px solid currentColor;
}

.replay {
  position: absolute;
  right: 4%;
  top: 12%;
  z-index: 10;
  border: none;
  background: transparent;
  color: #183c49;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 2px;
}

.replay:hover {
  opacity: .6;
}

/* 燕子 */

.bird {
  position: absolute;
  width: 150px;
  height: 120px;
  z-index: 5;
  top: 0;
  left: 0;
  opacity: 0;
  animation: swallowFlight 8s cubic-bezier(.45,.05,.35,1) forwards;
  animation-delay: 0s;
}

.bird svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.bird path,
.bird line {
  fill: none;
  stroke: #4b6170;
  stroke-width: 1.05;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bird .body {
  fill: rgba(198,212,222,.25);
}

.bird .wing-fill {
  fill: rgba(174,189,205,.16);
}

.bird .eye {
  fill: #344b5a;
  stroke: none;
}

@keyframes swallowFlight {
  0% {
    opacity: 0;
    transform: translate(8vw, 8vh) rotate(-18deg) scale(.65);
  }

  8% {
    opacity: .65;
  }

  25% {
    transform: translate(22vw, 20vh) rotate(8deg) scale(.8);
  }

  45% {
    transform: translate(38vw, 32vh) rotate(18deg) scale(.92);
  }

  65% {
    transform: translate(54vw, 43vh) rotate(10deg) scale(1);
  }

  82% {
    transform: translate(67vw, 52vh) rotate(25deg) scale(1.05);
  }

  92% {
    opacity: 1;
    transform: translate(75vw, 58vh) rotate(30deg) scale(1.08);
  }

  100% {
    opacity: 0;
    transform: translate(80vw, 65vh) rotate(35deg) scale(1.1);
  }
}

/* 飞行轨迹 */

.trail {
  position: absolute;
  width: 40%;
  height: 1px;
  left: 12%;
  top: 35%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3),
    transparent
  );
  transform: rotate(23deg);
}

/* 触水 */

.touch {
  position: absolute;
  width: 320px;
  height: 110px;
  top: 60%;
  left: 76%;
  transform: translate(-50%, -50%);
  z-index: 4;
}

.touch span {
  position: absolute;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 50%;
  inset: 0;
  opacity: 0;
  animation: touchRipple 3s ease-out infinite;
  animation-delay: 7s;
}

.touch span:nth-child(2) {
  animation-delay: 7.4s;
  inset: 15px 30px;
}

.touch span:nth-child(3) {
  animation-delay: 7.8s;
  inset: 30px 60px;
}

.touch span:nth-child(4) {
  animation-delay: 8.2s;
  inset: 42px 90px;
}

@keyframes touchRipple {
  0% {
    opacity: 0;
    transform: scale(.65);
  }

  25% {
    opacity: .8;
  }

  100% {
    opacity: 0;
    transform: scale(1.3);
  }
}

/* 项目入口 */

.choices {
  position: absolute;
  width: 82%;
  left: 9%;
  bottom: 17%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8%;
  z-index: 6;
  opacity: 0;
  animation: reveal 2s ease forwards;
  animation-delay: 8s;
}

@keyframes reveal {
  to {
    opacity: 1;
  }
}

.item {
  border-top: 1px solid rgba(25,59,72,.8);
  padding-top: 18px;
  cursor: pointer;
  transition: transform .4s ease, opacity .4s ease;
}

.item:hover {
  transform: translateY(-8px);
  opacity: .65;
}

.number {
  font-size: 15px;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

.item h2 {
  font-weight: 400;
  font-size: clamp(24px, 3vw, 38px);
  letter-spacing: 5px;
  margin-bottom: 15px;
}

.item p {
  font-size: clamp(12px, 1.5vw, 17px);
  letter-spacing: 3px;
  opacity: .85;
}

/* 底部 */

.footer {
  position: absolute;
  bottom: 4%;
  left: 4%;
  right: 4%;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  letter-spacing: 3px;
  z-index: 10;
}

/* 重新播放 */

.page.restart .bird {
  animation: none;
}

.page.restart .choices {
  animation: none;
  opacity: 0;
}

.page.restart .touch span {
  animation: none;
  opacity: 0;
}

/* 手机 */

@media (max-width: 700px) {

  .page {
    min-height: 550px;
  }

  .bird {
    width: 110px;
    height: 95px;
  }

  .choices {
    width: 88%;
    left: 6%;
    bottom: 20%;
    gap: 5%;
  }

  .item h2 {
    font-size: 20px;
    letter-spacing: 2px;
  }

  .item p {
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  .number {
    font-size: 12px;
  }

  .ripple {
    width: 180px;
    height: 70px;
  }

  .touch {
    left: 75%;
    top: 55%;
    width: 200px;
    height: 70px;
  }

  .replay {
    top: 11%;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="page" id="page">

<script>

let currentLang = "zh";

function setLang(lang) {

  currentLang = lang;

  document.getElementById("zh").classList.toggle("active", lang === "zh");
  document.getElementById("en").classList.toggle("active", lang === "en");

  if (lang === "en") {

    document.getElementById("replayText").textContent = "Replay";

    document.getElementById("socialTitle").textContent = "Social Media";
    document.getElementById("socialSub").textContent = "Content & Strategy";

    document.getElementById("visualTitle").textContent = "Visual Design";
    document.getElementById("visualSub").textContent = "Visual Expression";

    document.getElementById("videoTitle").textContent = "Video";
    document.getElementById("videoSub").textContent = "Video & Film";

    document.getElementById("footerText").textContent = "Portfolio";

  } else {

    document.getElementById("replayText").textContent = "重新播放";

    document.getElementById("socialTitle").textContent = "社交媒体";
    document.getElementById("socialSub").textContent = "账号运营与内容策划";

    document.getElementById("visualTitle").textContent = "视觉设计";
    document.getElementById("visualSub").textContent = "视觉表达与设计实践";

    document.getElementById("videoTitle").textContent = "影像";
    document.getElementById("videoSub").textContent = "视频与影像创作";

    document.getElementById("footerText").textContent = "个人作品集";

  }

}

function replay() {

  const page = document.getElementById("page");
  const bird = document.getElementById("bird");

  page.classList.add("restart");

  void page.offsetWidth;

  page.classList.remove("restart");

  bird.style.animation = "none";
  void bird.offsetWidth;
  bird.style.animation = "swallowFlight 8s cubic-bezier(.45,.05,.35,1) forwards";

  const choices = document.querySelector(".choices");
  choices.style.animation = "none";
  choices.style.opacity = "0";
  void choices.offsetWidth;
  choices.style.animation = "reveal 2s ease forwards";
  choices.style.animationDelay = "8s";

  const touchSpans = document.querySelectorAll(".touch span");

  touchSpans.forEach(span => {
    span.style.animation = "none";
    span.style.opacity = "0";
    void span.offsetWidth;
    span.style.animation = "";
  });

}

function openProject(type) {

  // 后续在这里添加项目页面跳转地址

}

</script>
