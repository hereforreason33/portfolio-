
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --paper: #e3ebea;
  --ink: #263334;
  --muted: #718383;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "DM Sans", "Noto Serif SC", sans-serif;
  overflow: hidden;
}

/* =========================
   NAVIGATION
========================= */

nav {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 30px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
}

.logo {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 400;
}

.language {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 1px;
}

.language button {
  background: none;
  border: none;
  color: #879493;
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
  transition: color .3s;
}

.language button.active {
  color: var(--ink);
}

/* =========================
   FULL SCREEN SCENE
========================= */

.hero {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 650px;
  overflow: hidden;
}

/* =========================
   WATER BACKGROUND
========================= */

.water {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      #edf2ef 0%,
      #dce8e7 35%,
      #cadcdd 68%,
      #bfd3d5 100%
    );
}

/* Soft reflected light */

.light-1 {
  position: absolute;
  width: 80%;
  height: 65%;
  top: 5%;
  left: 10%;

  background: radial-gradient(
    ellipse,
    rgba(255,255,255,.5) 0%,
    rgba(255,255,255,.12) 40%,
    transparent 75%
  );

  filter: blur(35px);
}

.light-2 {
  position: absolute;
  width: 60%;
  height: 40%;
  bottom: 0;
  left: 20%;

  background: radial-gradient(
    ellipse,
    rgba(255,255,255,.3),
    transparent 75%
  );

  filter: blur(30px);
}

/* Fine horizontal water texture */

.water-texture {
  position: absolute;
  inset: 0;
  opacity: .28;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 18px,
      rgba(65,100,105,.12) 19px,
      transparent 20px
    );
}

/* Soft horizontal reflection bands */

.water-lines {
  position: absolute;
  inset: 0;
  opacity: .2;

  background:
    linear-gradient(
      180deg,
      transparent 20%,
      rgba(255,255,255,.2) 30%,
      transparent 36%,
      rgba(255,255,255,.18) 51%,
      transparent 60%,
      rgba(80,110,115,.1) 75%,
      transparent 88%
    );
}

/* =========================
   SWALLOW
========================= */

.bird {
  position: absolute;
  width: 300px;
  left: -350px;
  top: 40%;
  z-index: 5;

  animation:
    fly 8s cubic-bezier(.25,.45,.35,1) forwards;
}

.bird svg {
  width: 100%;
  display: block;
  overflow: visible;
}

/* Flight path */

@keyframes fly {

  0% {
    left: -350px;
    top: 68%;
    transform: rotate(-10deg) scale(.7);
  }

  18% {
    top: 48%;
    transform: rotate(4deg) scale(.9);
  }

  38% {
    top: 27%;
    transform: rotate(-5deg) scale(1.1);
  }

  57% {
    top: 40%;
    transform: rotate(4deg) scale(1.18);
  }

  76% {
    top: 21%;
    transform: rotate(-4deg) scale(1.08);
  }

  100% {
    left: 120%;
    top: 35%;
    transform: rotate(2deg) scale(.9);
  }
}

/* =========================
   RIPPLE SYSTEM
========================= */

.ripple-group {
  position: absolute;
  width: 200px;
  height: 70px;
  z-index: 3;
  pointer-events: none;
}

.ripple {
  position: absolute;
  width: 100%;
  height: 100%;

  border: 1px solid rgba(70,100,105,.22);
  border-radius: 50%;

  transform: scale(.2);
  opacity: 0;

  animation: rippleWave 3s ease-out infinite;
}

.ripple::after {
  content: "";
  position: absolute;
  inset: 10px 20px;

  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50%;
}

@keyframes rippleWave {

  0% {
    transform: scale(.2);
    opacity: 0;
  }

  12% {
    opacity: .5;
  }

  100% {
    transform: scale(3.2);
    opacity: 0;
  }
}

/* Ripple locations */

.ripple-group:nth-child(1) {
  left: 8%;
  top: 73%;
}

.ripple-group:nth-child(2) {
  left: 25%;
  top: 61%;
}

.ripple-group:nth-child(3) {
  left: 43%;
  top: 53%;
}

.ripple-group:nth-child(4) {
  left: 62%;
  top: 43%;
}

.ripple-group:nth-child(5) {
  left: 81%;
  top: 36%;
}

/* Different timing */

.ripple-group:nth-child(1) .ripple {
  animation-delay: 1.2s;
}

.ripple-group:nth-child(2) .ripple {
  animation-delay: 2.4s;
}

.ripple-group:nth-child(3) .ripple {
  animation-delay: 3.6s;
}

.ripple-group:nth-child(4) .ripple {
  animation-delay: 4.8s;
}

.ripple-group:nth-child(5) .ripple {
  animation-delay: 6s;
}

/* =========================
   PROJECT MENU
========================= */

.choices {
  position: absolute;
  left: 0;
  bottom: 12%;
  width: 100%;

  padding: 0 9%;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 55px;

  z-index: 10;

  opacity: 0;
  transform: translateY(30px);

  animation: reveal 1.6s 8s forwards;
}

@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.choice {
  display: block;
  text-decoration: none;
  color: var(--ink);

  border-top: 1px solid rgba(40,55,55,.4);
  padding-top: 18px;

  transition: opacity .35s;
}

.choice:hover {
  opacity: .55;
}

.number {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 22px;
}

.choice h2 {
  font-weight: 300;
  font-size: 26px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.choice p {
  font-family: "Noto Serif SC", serif;
  font-weight: 300;
  font-size: 13px;
  color: #718181;
  letter-spacing: 1px;
}

/* =========================
   REPLAY BUTTON
========================= */

.replay {
  position: absolute;
  right: 5%;
  top: 105px;

  z-index: 20;

  background: none;
  border: none;
  color: #718181;

  font-family: inherit;
  font-size: 11px;
  letter-spacing: 1px;

  cursor: pointer;
  transition: opacity .3s;
}

.replay:hover {
  opacity: .5;
}

/* =========================
   FOOTER
========================= */

.footer {
  position: absolute;
  bottom: 28px;
  left: 5%;
  right: 5%;

  display: flex;
  justify-content: space-between;

  font-size: 10px;
  color: #718181;
  letter-spacing: 1px;

  z-index: 20;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  .hero {
    min-height: 650px;
  }

  nav {
    padding: 24px 6%;
  }

  .bird {
    width: 190px;
  }

  .choices {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 0 8%;
    bottom: 12%;
  }

  .choice {
    padding-top: 10px;
  }

  .number {
    margin-bottom: 8px;
  }

  .choice h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }

  .choice p {
    font-size: 12px;
  }

  .ripple-group {
    width: 120px;
    height: 40px;
  }

  .footer {
    bottom: 18px;
  }

  .replay {
    top: 85px;
  }
}

</style>
</head>

<body>

<nav>

  <div class="logo">PORTFOLIO / 2026</div>

  <div class="language">
    <button id="zhBtn" class="active" onclick="changeLanguage('zh')">
      中文
    </button>

    <span>/</span>

    <button id="enBtn" onclick="changeLanguage('en')">
      EN
    </button>
  </div>

</nav>

<main class="hero">

  <!-- Water background -->

  <div class="water">

    <div class="light-1"></div>
    <div class="light-2"></div>

    <div class="water-texture"></div>
    <div class="water-lines"></div>

    <!-- Ripples -->

    <div class="ripple-group">
      <div class="ripple"></div>
    </div>

    <div class="ripple-group">
      <div class="ripple"></div>
    </div>

    <div class="ripple-group">
      <div class="ripple"></div>
    </div>

    <div class="ripple-group">
      <div class="ripple"></div>
    </div>

    <div class="ripple-group">
      <div class="ripple"></div>
    </div>

  </div>

  <!-- Swallow -->

  <div class="bird" id="bird">

    <svg
      viewBox="0 0 200 120"
      xmlns="http://www.w3.org/2000/svg"
    >

      <path
        d="
        M20 62
        C45 40, 65 38, 90 48
        C108 34, 130 12, 160 8
        C142 35, 125 52, 115 63
        C145 58, 170 55, 190 65
        C160 70, 135 76, 115 77
        C100 90, 80 100, 58 103
        C75 85, 85 77, 90 68
        C65 78, 45 80, 20 62
        Z
        "
        fill="#263334"
      />

    </svg>

  </div>

  <!-- Project Categories -->

  <section class="choices">

    <a href="#" class="choice">

      <div class="number">01 /</div>

      <h2 id="title1">
        社交媒体
      </h2>

      <p id="desc1">
        账号运营与内容策划
      </p>

    </a>

    <a href="#" class="choice">

      <div class="number">02 /</div>

      <h2 id="title2">
        视觉设计
      </h2>

      <p id="desc2">
        视觉表达与设计实践
      </p>

    </a>

    <a href="#" class="choice">

      <div class="number">03 /</div>

      <h2 id="title3">
        影像
      </h2>

      <p id="desc3">
        视频与影像创作
      </p>

    </a>

  </section>

  <!-- Replay -->

  <button
    class="replay"
    id="replayBtn"
    onclick="startAnimation()"
  >
    ↻ 重新播放
  </button>

  <!-- Footer -->

  <footer class="footer">

    <span id="footerLeft">
      个人作品集
    </span>

    <span>2026</span>

  </footer>

</main>

<script>

/* =========================
   LANGUAGE
========================= */

const translations = {

  zh: {
    title1: "社交媒体",
    desc1: "账号运营与内容策划",

    title2: "视觉设计",
    desc2: "视觉表达与设计实践",

    title3: "影像",
    desc3: "视频与影像创作",

    footer: "个人作品集",
    replay: "重新播放"
  },

  en: {
    title1: "Social Media",
    desc1: "Content & Account Management",

    title2: "Visual Design",
    desc2: "Visual Communication & Design",

    title3: "Video",
    desc3: "Moving Image & Video",

    footer: "Selected Works",
    replay: "Replay"
  }

};

function changeLanguage(lang) {

  const t = translations[lang];

  document.getElementById("title1").textContent = t.title1;
  document.getElementById("desc1").textContent = t.desc1;

  document.getElementById("title2").textContent = t.title2;
  document.getElementById("desc2").textContent = t.desc2;

  document.getElementById("title3").textContent = t.title3;
  document.getElementById("desc3").textContent = t.desc3;

  document.getElementById("footerLeft").textContent = t.footer;

  document.getElementById("replayBtn").textContent = "↻ " + t.replay;

  document.getElementById("zhBtn").classList.toggle(
    "active",
    lang === "zh"
  );

  document.getElementById("enBtn").classList.toggle(
    "active",
    lang === "en"
  );

}

/* =========================
   REPLAY ANIMATION
========================= */

function startAnimation() {

  const bird = document.getElementById("bird");
  const choices = document.querySelector(".choices");
  const ripples = document.querySelectorAll(".ripple");

  /* Reset bird */

  bird.style.animation = "none";

  /* Reset menu */

  choices.style.animation = "none";
  choices.style.opacity = "0";
  choices.style.transform = "translateY(30px)";

  /* Reset ripples */

  ripples.forEach(ripple => {
    ripple.style.animation = "none";
  });

  /* Force refresh */

  bird.offsetHeight;
  choices.offsetHeight;

  ripples.forEach(ripple => {
    ripple.offsetHeight;
  });

  /* Restart */

  bird.style.animation =
    "fly 8s cubic-bezier(.25,.45,.35,1) forwards";

  choices.style.animation =
    "reveal 1.6s 8s forwards";

  ripples.forEach(ripple => {
    ripple.style.animation = "";
  });

}

</script>

</body>
</html>
